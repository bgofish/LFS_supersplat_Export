[project]
name = "lfs_supersplat"
version = "0.1.1"
description = "Upload LichtFeld Studio splat scenes to SuperSplat"
authors = [{name = "PlayCanvas Ltd."}]
requires-python = ">=3.10"
dependencies = []

[tool.lichtfeld]
hot_reload = true
plugin_api = ">=1,<2"
lichtfeld_version = ">=0.5.3"
required_features = ["panels.v1", "settings.v1", "signals.v1"]
